name: assess-dependency-risk
description: Flag transparent dependency inventory risk signals using supplied metadata only.
input_schema:
  type: object
  properties:
    dependencies:
      type: array
      items:
        type: object
        properties:
          name: {type: string}
          version: {type: string}
          ecosystem: {type: string}
          support_status: {type: string}
          advisories: {type: array}
        required: [name]
  required: [dependencies]
